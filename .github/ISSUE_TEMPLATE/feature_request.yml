name: 功能建议
description: 提议符合轻量、离线边界的新功能
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Metrilens 优先保持轻量、离线、无需管理员权限。请说明建议解决的真实场景。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述最小可用方案，而不是只写功能名称。
    validations:
      required: true

  - type: textarea
    id: lightweight
    attributes:
      label: 对轻量目标的影响
      description: 是否需要更高采样频率、联网、外部进程、管理员权限或显著增加常驻资源？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案

  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 我理解当前版本仅支持 Apple Silicon。
          required: true
        - label: 我理解 v1 不包含 Developer ID 签名和公证。
          required: true
